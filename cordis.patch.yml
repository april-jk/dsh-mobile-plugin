# Add the remote Companion to the DSH web profile. The Host plugin follows the
# DSH process lifecycle and keeps every remote network connection outbound.
- id: directory-picker
  disabled: true

- insert:
    - id: dsh-mobile-directory-picker
      name: '@deepseek-ai/dsh-host-directory-picker-browse'

    - id: dsh-mobile-directory-picker-ui
      name: '@deepseek-ai/dsh-client-ui-directory-picker-browse'

    - id: dsh-mobile
      name: dsh-mobile
      inject: [webStartup, webServer]
      config:
        relay: !!js process.env.DSH_RELAY ?? 'https://dsh-relay-production.up.railway.app'
        dshPort: !!js ctx.webStartup.port ?? 3080
