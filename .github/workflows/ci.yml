name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Verify committed bundle is current
        run: git diff --exit-code -- dist
      - run: npm pack --dry-run
      - name: Verify current DSH Developer Preview compatibility
        run: npx --yes @deepseek-ai/dsh@0.1.0-rc.6 plugin --profile web add .
